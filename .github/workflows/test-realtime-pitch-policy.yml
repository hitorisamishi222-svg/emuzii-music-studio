name: Test Realtime Pitch Correction Policy
on:
  push:
    branches: [feature/vocal-recorder-v1]
    paths:
      - 'integration/realtime-pitch-correction-policy.js'
      - 'integration/offline-monophonic-pitch-estimator.js'
      - 'integration/offline-vocal-correction-analysis.js'
      - 'integration/offline-pitch-shift-prototype.js'
      - 'integration/offline-pitch-shift-audit.js'
      - 'integration/long-window-pitch-research.js'
      - 'tests/realtime-pitch-correction-policy.test.mjs'
      - 'tests/offline-monophonic-pitch-estimator.test.mjs'
      - 'tests/offline-vocal-correction-analysis.test.mjs'
      - 'tests/offline-pitch-shift-prototype.test.mjs'
      - 'tests/offline-pitch-shift-audit.test.mjs'
      - 'tests/long-window-pitch-research.test.mjs'
      - '.github/workflows/test-realtime-pitch-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate selective pitch decisions without audio manipulation
        run: node --test tests/realtime-pitch-correction-policy.test.mjs tests/offline-monophonic-pitch-estimator.test.mjs tests/offline-vocal-correction-analysis.test.mjs tests/offline-pitch-shift-prototype.test.mjs tests/offline-pitch-shift-audit.test.mjs tests/long-window-pitch-research.test.mjs
