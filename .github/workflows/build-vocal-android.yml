name: Build Android Vocal APK
on:
  push:
    branches: [feature/vocal-recorder-v1]
    paths:
      - 'vocal/**'
      - 'android-vocal/**'
      - '.github/workflows/build-vocal-android.yml'
  workflow_dispatch:
jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compile debug APK
        working-directory: android-vocal
        run: gradle :app:assembleDebug --no-daemon
      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: ASAHI-Vocal-Android-debug
          path: android-vocal/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
