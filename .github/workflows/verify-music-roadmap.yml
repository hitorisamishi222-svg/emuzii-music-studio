name: Verify ASAHI MUSIC roadmap
on:
  push:
    branches: [feature/vocal-recorder-v1]
    paths:
      - 'planning/music-roadmap-v1.json'
      - 'scripts/music-plan.mjs'
      - 'tests/music-plan.test.mjs'
      - 'tests/ace-proxy-contract.test.mjs'
      - 'tests/ace-generation-mock.test.mjs'
      - 'tests/asahi-project-reader-safety.test.mjs'
      - 'tests/manual-project-save-scope.test.mjs'
      - 'app-v10.3.2.html'
      - 'api/ace/**'
      - '.github/workflows/verify-music-roadmap.yml'
  workflow_dispatch:

jobs:
  roadmap-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate plan, evidence and production safeguards
        run: node --test tests/music-plan.test.mjs
      - name: Verify ACE-Step proxy auth with mocked upstream (no GPU)
        run: node --test tests/ace-proxy-contract.test.mjs
      - name: Verify ACE-Step mock release / poll / audio retrieval without GPU
        run: node --test tests/ace-generation-mock.test.mjs
      - name: Verify project import safety without user recordings
        run: node --test tests/asahi-project-reader-safety.test.mjs
      - name: Protect difference between settings export and full local project
        run: node --test tests/manual-project-save-scope.test.mjs
      - name: Print eligible tasks without executing them
        run: node scripts/music-plan.mjs
