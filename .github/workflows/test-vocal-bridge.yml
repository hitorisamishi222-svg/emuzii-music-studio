name: Test Vocal Bridge Contract
on:
  push:
    branches: [feature/vocal-recorder-v1]
    paths:
      - 'app-v10.3.2.html'
      - 'vocal/**'
      - 'integration/**'
      - 'v104-loader.js'
      - 'index.html'
      - 'android-vocal/app/src/main/java/com/asahi/vocal/MainActivity.java'
      - 'tests/vocal-bridge-contract.test.mjs'
      - '.github/workflows/test-vocal-bridge.yml'
  workflow_dispatch:

jobs:
  vocal-bridge-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Studio ↔ Vocal bridge contract
        run: node tests/vocal-bridge-contract.test.mjs
