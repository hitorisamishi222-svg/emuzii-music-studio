name: Test Outro Finisher
on:
  push:
    branches:
      - feature/vocal-recorder-v1
    paths:
      - integration/audio-tail-finisher.js
      - integration/japanese-outro-edit-plan.js
      - tests/audio-tail-finisher.test.mjs
      - tests/japanese-outro-edit-plan.test.mjs
      - tools/outro-finisher.html
      - tests/outro-finisher-browser.test.mjs
      - .github/workflows/test-outro-finisher.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outro-finisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check outro WAV encoding and non-destructive tail behavior
        run: node --test tests/audio-tail-finisher.test.mjs tests/japanese-outro-edit-plan.test.mjs
      - name: Install Chromium for targeted UI smoke test
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify audio file upload and downloadable 2-second silent WAV in Chromium
        run: node tests/outro-finisher-browser.test.mjs
