services:
  acestep:
    image: ghcr.io/ace-step/ace-step-1.5:latest
    restart: unless-stopped
    environment:
      ACESTEP_MODE: api
      ACESTEP_API_HOST: 0.0.0.0
      ACESTEP_API_PORT: 8001
      ACESTEP_API_KEY: ${ACESTEP_API_KEY}
      ACESTEP_API_WORKERS: "1"
      ACESTEP_QUEUE_WORKERS: "1"
      ACESTEP_INIT_SERVICE: "true"
      ACESTEP_CONFIG_PATH: ${ACESTEP_CONFIG_PATH:-acestep-v15-turbo}
      ACESTEP_LM_MODEL_PATH: ${ACESTEP_LM_MODEL_PATH:-acestep-5Hz-lm-4B}
      ACESTEP_LLM_BACKEND: ${ACESTEP_LLM_BACKEND:-pt}
      TOKENIZERS_PARALLELISM: "false"
    ports:
      - "8001:8001"
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./output:/app/output
      - ./gradio_outputs:/app/gradio_outputs
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
